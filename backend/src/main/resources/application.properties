server.port=${PORT:5000}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/university_bus_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# JWT Configuration (256-bit secret key)
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# File Upload Configuration
file.upload-dir=${UPLOAD_DIR:./uploads}
app.media.base-url=${MEDIA_BASE_URL:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# CORS Configuration (comma-separated allowed origins)
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.university.bustracking=INFO
logging.level.org.springframework.security=WARN

# Initial Administrator Bootstrap (Optional, one-time setup if zero admins exist)
app.admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
