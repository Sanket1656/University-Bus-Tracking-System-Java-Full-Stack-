# ==============================================================================
# Production Spring Profile: application-prod.properties
# Activated via: spring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

# Server Configuration
server.port=${PORT:5000}

# MySQL Database Configuration
# In production, database connection parameters must be provided via environment variables.
# No fallback defaults are supplied to prevent accidental connection to unsecured databases.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
# STRICT: In production, DDL is strictly set to 'validate' to prevent automated schema mutation.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# JWT Configuration
# In production, a cryptographically random 256-bit Base64-encoded secret MUST be supplied.
# Startup will fail immediately if JWT_SECRET is not provided.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# File Upload & Media Storage
# Production requires an absolute, persistent filesystem path (e.g. /var/app/uploads or /mnt/data/uploads).
file.upload-dir=${UPLOAD_DIR}
app.media.base-url=${MEDIA_BASE_URL:}
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# CORS Allowed Origins
# Must explicitly list trusted client origins (e.g. https://bus.university.edu,https://admin.bus.university.edu).
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Logging Levels (Production hygiene: avoid verbose or sensitive logs)
logging.level.com.university.bustracking=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
logging.level.org.springframework.web=WARN

# Initial Administrator Bootstrap (Optional, one-time setup if zero admins exist in database)
app.admin.bootstrap.username=${ADMIN_BOOTSTRAP_USERNAME:}
app.admin.bootstrap.password=${ADMIN_BOOTSTRAP_PASSWORD:}
